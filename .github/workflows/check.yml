name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar integridade dos exercícios
        run: python tools/verify_exercises.py
      - name: Verificar repositório
        run: python tools/check_repository.py
      - name: Rodar testes
        run: python -m unittest discover -s tests -v
